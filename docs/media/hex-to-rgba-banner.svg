<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Hex to RGBA using PHP</title>
  <desc id="desc">Modern PHP color conversion utility and tutorial banner showing hex to RGB and RGBA conversion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6df6"/>
      <stop offset="1" stop-color="#1559ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1f3f7a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1598" height="558" rx="34" fill="url(#bg)" stroke="#e7ebf3"/>
  <circle cx="1170" cy="120" r="220" fill="#eef4ff"/>
  <path d="M1110 470 C1290 350 1430 380 1600 465 L1600 560 L1050 560 Z" fill="#e9f1ff"/>
  <circle cx="80" cy="520" r="120" fill="#eef4ff"/>

  <g transform="translate(78 70)">
    <text x="0" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" fill="#0d0f13">Hex to RGBA</text>
    <text x="0" y="146" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" fill="#0d0f13">using <tspan fill="#2563eb">PHP</tspan></text>
    <text x="0" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#667085">Modern PHP color conversion utility &amp; tutorial</text>

    <g transform="translate(0 246)">
      <rect x="0" y="0" width="260" height="92" rx="22" fill="#ffffff" stroke="#dfe5ee" filter="url(#shadow)"/>
      <rect x="24" y="22" width="48" height="48" rx="12" fill="url(#blue)"/>
      <text x="92" y="46" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24" font-weight="700" fill="#101828">#2563eb</text>
      <text x="92" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#7c8799">Hex color</text>

      <path d="M282 46 H328 M316 34 L328 46 L316 58" fill="none" stroke="#8a96a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="354" y="0" width="326" height="92" rx="22" fill="#edf3ff"/>
      <text x="380" y="42" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23" font-weight="700" fill="#101828">rgb(37 99 235 / 0.25)</text>
      <text x="380" y="69" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#7c8799">CSS modern syntax (with alpha)</text>

      <rect x="354" y="108" width="326" height="74" rx="18" fill="#f4f5f7"/>
      <text x="380" y="140" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="21" fill="#303846">rgba(37, 99, 235, 0.25)</text>
      <text x="380" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#8a94a5">Classic RGBA format</text>
    </g>

    <g transform="translate(0 462)">
      <circle cx="10" cy="0" r="10" fill="#2563eb"/>
      <circle cx="40" cy="0" r="10" fill="#a9c6ff"/>
      <circle cx="70" cy="0" r="10" fill="#e5e8ef"/>
      <line x1="98" y1="-13" x2="98" y2="13" stroke="#c8cfda" stroke-width="2"/>
      <text x="118" y="8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#7b8798">Simple inputs. Accurate results. Runs on the server with PHP.</text>
    </g>
  </g>

  <g transform="translate(900 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="620" height="420" rx="28" fill="#ffffff" stroke="#dfe5ee"/>
    <rect x="24" y="24" width="248" height="372" rx="20" fill="#f6f7f9" stroke="#e3e7ee"/>
    <text x="44" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#101828">Hex color</text>
    <rect x="44" y="76" width="208" height="48" rx="12" fill="#ffffff" stroke="#ccd3df"/>
    <text x="60" y="107" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700" fill="#101828">#2563eb</text>
    <text x="44" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#101828">Alpha (0–1)</text>
    <rect x="44" y="174" width="208" height="48" rx="12" fill="#ffffff" stroke="#ccd3df"/>
    <text x="60" y="205" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="700" fill="#101828">0.25</text>
    <rect x="44" y="242" width="176" height="54" rx="14" fill="#090a0d"/>
    <text x="132" y="276" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Convert with PHP</text>

    <rect x="292" y="24" width="304" height="372" rx="20" fill="#f7f8fa" stroke="#e3e7ee"/>
    <rect x="310" y="44" width="268" height="136" rx="18" fill="#b9cdf4" stroke="#90b0eb"/>
    <rect x="330" y="142" width="186" height="28" rx="9" fill="#ffffff"/>
    <text x="342" y="162" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700" fill="#101828">rgb(37 99 235 / 0.25)</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#5f6878">
      <text x="316" y="218">Normalized</text><text x="438" y="218" font-weight="700" fill="#101828">#2563eb</text>
      <text x="316" y="246">Red</text><text x="438" y="246" fill="#101828">37</text>
      <text x="316" y="274">Green</text><text x="438" y="274" fill="#101828">99</text>
      <text x="316" y="302">Blue</text><text x="438" y="302" fill="#101828">235</text>
      <text x="316" y="330">Hex alpha</text><text x="438" y="330" fill="#101828">none</text>
    </g>
    <rect x="310" y="346" width="268" height="34" rx="10" fill="#e8eaee"/>
    <text x="326" y="368" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#202632">rgba(37, 99, 235, 0.25)</text>
  </g>

  <g transform="translate(1460 34)" stroke="#2563eb" stroke-width="8" stroke-linecap="round">
    <line x1="0" y1="18" x2="4" y2="0"/>
    <line x1="28" y1="28" x2="42" y2="16"/>
    <line x1="38" y1="56" x2="58" y2="56"/>
  </g>
</svg>
