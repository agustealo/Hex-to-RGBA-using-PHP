name: Documentation Media

on:
  workflow_dispatch:
  push:
    branches:
      - modernize/tutorial-2026
    paths:
      - 'demo/**'
      - 'hex2rgba.php'
      - 'scripts/capture-doc-media.sh'
      - '.github/workflows/docs-media.yml'

permissions:
  contents: write

jobs:
  capture:
    name: Capture real demo media
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: modernize/tutorial-2026

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install media tooling
        run: sudo apt-get update && sudo apt-get install --yes imagemagick

      - name: Capture screenshots and GIF
        run: bash scripts/capture-doc-media.sh

      - name: Verify generated media
        run: |
          test -s docs/media/screenshots/demo-default.png
          test -s docs/media/screenshots/demo-converted.png
          test -s docs/media/screenshots/demo-validation.png
          test -s docs/media/gifs/conversion-flow.gif
          file docs/media/screenshots/*.png docs/media/gifs/*.gif

      - name: Commit refreshed media
        run: |
          if git diff --quiet -- docs/media; then
            echo 'Documentation media is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media
          git commit -m 'docs: refresh real demo media [skip ci]'
          git push origin HEAD:modernize/tutorial-2026
