name: PHP Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint utility
        run: php -l hex2rgba.php

      - name: Lint tests
        run: php -l tests/run.php

      - name: Lint demo
        run: php -l demo/index.php

      - name: Run regression tests
        run: php tests/run.php
